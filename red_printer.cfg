##########################################################################
#  VERSION E3D REVO VORON
##########################################################################

# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_310029000E5053424E363620-if00   # v2red
# serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_15001800105053424E363620-if00   # v2green
restart_method: command

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_3033393834044420-if00
## kaput /dev/serial/by-id/usb-Klipper_rp2040_3134363332113871-if00
restart_method: command
##--------------------------------------------------------------------

[mcu HBB]
## Bigtreetech Hot Buttons Board (HBB)
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474E621A82486A-if00  # v2Red

#####################################################################
#   E3D Revo hotend thermistor 104NT-4
#####################################################################
[thermistor ATC Semitec 104NT-4-R025H42G]
temperature1: 25
resistance1: 100000
temperature2: 160
resistance2: 1074
temperature3: 300
resistance3: 82.78

##--------------------------------------------------------------------

#####################################################################
#  ADXL345
#####################################################################
[include adxl345.cfg]

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 3000             #Max 4000
# max_accel: 10000             #Max 4000
minimum_cruise_ratio: 0.5
max_z_velocity: 30        #Max 15 for 12V TMC Drivers, can increase for 24V
# max_z_accel: 300
max_z_accel: 300
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: nhk:gpio13
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 350mm build
position_max: 350
position_endstop: 350

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------

##  Uncomment for 350mm build
position_max: 358
position_endstop: 358

##--------------------------------------------------------------------
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop

##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------

##  Uncomment below for 350mm build
position_max: 310

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
    step_pin: nhk:gpio23
    dir_pin: nhk:gpio24
    enable_pin: !nhk:gpio25
    pullup_resistor: 2200

    # step_pin: PE2
    #step_pin: 
    #dir_pin: PE3
    #enable_pin: !PD4

    ##  Update value below when you perform extruder calibration
    ##  If you ask for 100mm of filament, but in reality it is 98mm:
    ##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
    ##  22.6789511 is a good starting point
    rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
    ##  Update Gear Ratio depending on your Extruder Type
    ##  Use 50:10 for Stealthburner/Clockwork 2
    ##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
    ##  Use 80:20 for M4, M3.1
    gear_ratio: 50:10               # Stealthburner/Clockwork 2
    microsteps: 32
    full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
    nozzle_diameter: 0.400
    filament_diameter: 1.75
    heater_pin: nhk:gpio9
    ## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
    sensor_type: ATC Semitec 104NT-4-R025H42G
    sensor_pin: nhk:gpio29
    min_temp: 10
    max_temp: 270
    max_power: 1.0
    min_extrude_temp: 170
    max_extrude_cross_section: 10
    max_extrude_only_distance: 150
    #control = pid
    #pid_Kp: 21.527
    #pid_Ki: 1.063
    #pid_Kd: 108.982
    ##  Try to keep pressure_advance below 1.0
    #pressure_advance: 0.05
    ##  Default is 0.040, leave stock
    #pressure_advance_smooth_time: 0.040

##  E0 on MOTOR6
##  Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
    sense_resistor: 0.110
    uart_pin: nhk:gpio0
    tx_pin: nhk:gpio1
    interpolate: false
    run_current: 0.5
    # stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

#  SSR Pin - HE1
#  Thermistor - TB
[heater_bed]
##  Uncomment the following line if using the default SSR wiring from the docs site
heater_pin: PA3
##  Other wiring guides may use BED_OUT to control the SSR. Uncomment the following line for those cases
#heater_pin: PA1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Probe
#####################################################################

##  Inductive Probe
##  This probe is not used for Z height, only Quad Gantry Leveling
[probe]

activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

#--------------------------------------------------------------------
## Select the probe port by type:
## For the PROBE port. Will not work with Diode. May need pull-up resistor from signal to 24V.
pin: !nhk:gpio10
## For the DIAG_7 port. NEEDS BAT85 DIODE! Change to !PG15 if probe is NO.
#pin: PG15
## For Octopus Pro PROBE port; NPN and PNP proximity switch types can be set by jumper
#pin: ~!PC5
#--------------------------------------------------------------------

x_offset: 0
y_offset: 0
#z_offset: 0.350
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan - FAN0
[fan]
pin: nhk:gpio6
max_power: 1.0
kick_start_time: 0.9
hardware_pwm: False
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10
tachometer_pin: nhk:gpio17
tachometer_ppr: 2

## HEF
##  Hotend Fan - FAN1
[heater_fan hotend_fan]
pin: nhk:gpio5
max_power: 1.0
kick_start_time: 0.9
heater: extruder
heater_temp: 50.0
#  If you are experiencing back flow, you can reduce fan_speed
fan_speed: 1.0
tachometer_pin: nhk:gpio16
tachometer_ppr: 2


##  Controller fan - FAN2
[controller_fan contoroler_fan_1]
pin: PD12
kick_start_time: 0.8
max_power: 1.0
shutdown_speed: 0.3
hardware_pwm: True

[heater_fan contoroler_fan_2]
##	Controller fan - CNC_FAN2
pin: PD13
kick_start_time: 0.5
shutdown_speed: 0.3
heater: heater_bed
heater_temp: 60.0
hardware_pwm: True

[temperature_fan chamber]
pin: PD14
sensor_type:  Generic 3950
#sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF5
max_temp: 60
min_temp: 0
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 2.0
off_below: 0.3
cycle_time:0.01
max_speed: 1.0
min_speed: 0.1
target_temp: 45.0
control = pid
gcode_id: C
pid_kp = 37.490
pid_ki = 1.572
pid_kd = 223.536

[temperature_fan raspi_fan]
#cooling raspi
pin: PD15
max_power: 1.0
kick_start_time: 2.0
max_temp: 70
max_speed: 1.0
min_temp: 0
target_temp: 45.0
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
control = pid
pid_kp = 37.490
pid_ki = 1.572
pid_kd = 223.536

[temperature_sensor chamber_head]
sensor_type: Generic 3950
sensor_pin: nhk:gpio28
min_temp: 0
max_temp: 100
gcode_id: head
#   See the "heater_generic" section for the definition of this
#   parameter.


#####################################################################
#   Input Shaper
#   after resonance testing
#####################################################################

[input_shaper]
shaper_freq_x: 49.0
shaper_type_x: mzv
shaper_freq_y: 38.2
shaper_type_y: mzv

######################################################################
# Chamber Lighting LED Control
######################################################################

[output_pin caselight]
pin: PB10
pwm: true
hardware_pwm: true
shutdown_value: 0.01
value: 0.06
cycle_time: 0.0083333
scale: 1

# Lighting Control
[gcode_macro lights_off]
gcode:
    SET_PIN PIN=caselight VALUE=0

[gcode_macro lights_max]
gcode:
    SET_PIN PIN=caselight VALUE=1

[gcode_macro lights_on]
gcode:
    SET_PIN PIN=caselight VALUE=0.10

[gcode_macro lights_toggle]
gcode:
    {% if printer["output_pin caselight"].value == 100 %}
        lights_off
    {% else %}
        lights_on
    {% endif %}

[include common/homing_gantry.cfg]

[idle_timeout]
timeout: 1800

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Displays
#####################################################################

#  mini12864 LCD Display
[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[include common/lcd_tweak.cfg]

#  To control Neopixel RGB in mini12864 display
[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 0.0
color_order: RGB

#  Set RGB values on boot up for each Neopixel. 
#  Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0.2 INDEX=2 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0.2 INDEX=3 

